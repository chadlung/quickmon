[package]
name = "quickmon"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "quickmon"
path = "src/lib.rs"

[[bin]]
name = "quickmon"
path = "src/main.rs"

[dependencies]
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
iced = { version = "0.14", features = ["tokio"] }
rfd = "0.15"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
